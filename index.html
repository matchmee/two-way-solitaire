<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Two‑Way Solitaire (v3.8)</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="hdr">
    <h1>Two‑Way Solitaire</h1>
    <div class="controls">
      <label class="scale">
        <span>Size</span>
        <input id="scaleRange" type="range" min="60" max="120" step="2" value="100">
        <output id="scaleOut">100%</output>
      </label>
      <label class="fitwrap">
        <input id="fitToggle" type="checkbox" checked>
        <span>Fit</span>
      </label>
      <button id="newGameBtn" title="Start a new game">New</button>
      <button id="undoBtn" title="Undo last move">Undo</button>
      <button id="helpBtn" title="How to play">?</button>
    </div>
  </header>

  <main id="mainArea">
    <section id="foundRow" class="row foundations-row" aria-label="Foundations">
      <div class="pile foundation" data-pile="F0" aria-label="Foundation 1"></div>
      <div class="pile foundation" data-pile="F1" aria-label="Foundation 2"></div>
      <div class="pile foundation" data-pile="F2" aria-label="Foundation 3"></div>
      <div class="pile foundation" data-pile="F3" aria-label="Foundation 4"></div>
      <div class="spacer"></div>
      <div class="stock-area">
        <div class="pile stock" data-pile="STOCK" aria-label="Stock"></div>
        <div class="pile waste" data-pile="WASTE"></div>
      </div>
    </section>

    <section id="tabRow" class="row tableaus-row" aria-label="Tableaus">
      <div class="pile tableau" data-pile="T0" aria-label="Tableau 1"></div>
      <div class="pile tableau" data-pile="T1" aria-label="Tableau 2"></div>
      <div class="pile tableau" data-pile="T2" aria-label="Tableau 3"></div>
      <div class="pile tableau" data-pile="T3" aria-label="Tableau 4"></div>
      <div class="pile tableau" data-pile="T4" aria-label="Tableau 5"></div>
      <div class="pile tableau" data-pile="T5" aria-label="Tableau 6"></div>
      <div class="pile tableau" data-pile="T6" aria-label="Tableau 7"></div>
    </section>
  </main>

  <footer id="ftr">
    <div id="status">Fit = tallest stack fills screen; turn off to use slider cap (60–120%).</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
